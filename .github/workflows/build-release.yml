name: Build and Release Executables

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: x86_64
            artifact_name: lessampler-linux-x86_64
            binary_name: lessampler
            binary_dir: build/src
            archive_ext: tar.gz

          - os: macos-latest
            platform: macos
            arch: arm64
            artifact_name: lessampler-macos-arm64
            binary_name: lessampler
            binary_dir: build/src
            archive_ext: zip

          - os: windows-latest
            platform: windows
            arch: x86_64
            artifact_name: lessampler-windows-x86_64
            binary_name: lessampler.exe
            binary_dir: build/src/Release
            archive_ext: zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build gcc g++

      - name: Configure CMake
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build Executable
        run: |
          cmake --build build --config Release --parallel

      - name: Run Tests
        working-directory: build
        run: |
          ctest --output-on-failure -C Release

      - name: Stage Release Package (Linux & macOS)
        if: runner.os != 'Windows'
        run: |
          mkdir -p package
          cp ${{ matrix.binary_dir }}/${{ matrix.binary_name }} package/
          cp README.md LICENSE package/ || true
          cd package
          chmod +x ${{ matrix.binary_name }}
          if [ "${{ matrix.archive_ext }}" = "tar.gz" ]; then
            tar -czvf ../${{ matrix.artifact_name }}.tar.gz *
          else
            zip -r ../${{ matrix.artifact_name }}.zip *
          fi

      - name: Stage Release Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package
          Copy-Item "${{ matrix.binary_dir }}/${{ matrix.binary_name }}" -Destination package/
          if (Test-Path "README.md") { Copy-Item "README.md" -Destination package/ }
          if (Test-Path "LICENSE") { Copy-Item "LICENSE" -Destination package/ }
          Compress-Archive -Path "package/*" -DestinationPath "${{ matrix.artifact_name }}.zip" -Force

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ matrix.artifact_name }}.${{ matrix.archive_ext }}
            package/${{ matrix.binary_name }}
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare Release Assets
        run: |
          mkdir -p release_assets
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" \) -exec cp {} release_assets/ \;
          ls -la release_assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
